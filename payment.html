<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.pricing-card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  width: 300px;
  padding: 20px;
  position: relative;
}

.tag {
  background-color: #ffe100;
  color: #000;
  font-weight: bold;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  position: absolute;
  top: -10px;
  left: 10px;
}

.pricing-details .line {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.green {
  color: green;
  font-weight: bold;
}

.red {
  color: red;
  font-size: 12px;
  margin-top: -8px;
  margin-bottom: 10px;
}

.total {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  font-size: 18px;
  margin: 15px 0;
}

.coupon-link a {
  color: #007bff;
  font-size: 13px;
  text-decoration: none;
}

.savings {
  background-color: #e6f5e9;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
  margin: 15px 0;
  font-weight: bold;
}

.pay-button {
  width: 100%;
  background-color: #28a745;
  border: none;
  padding: 12px;
  color: white;
  font-size: 16px;
  border-radius: 15px;
  cursor: pointer;
}

.terms {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  color: #444;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment</title>
</head>
<body>
    <div class="pricing-card">
  <div class="tag">Limited Time Discount</div>

  <div class="pricing-details">
    <div class="line">
      <span>Course Price</span>
      <span> £90</span>
    </div>
    <div class="line green">
      <span>Discount</span>
      <span>- £46.50</span>
    </div>
    <div class="subtext red">(Exclusive Offer)</div>
    <div class="line">
      <span>Premium Discount</span>
      <span> £46.50</span>
    </div>
    <hr />
    <div class="total">
      <span>You Pay :</span>
      <span> £43.50</span>
    </div>
    <div class="coupon-link">
      <a href="#">Have a coupon?</a>
    </div>
    <div class="savings">
      <span> You Save :- £46.50 </span>
    </div>
    <a href="dingdong.html">
    <button id="pay-button" class="pay-button">Pay Now</button>
    </a>
    <div class="terms">
      <span>Terms & Conditions</span>
    </div>
  </div>
</div>
<script>
  document.getElementById('pay-button').onclick = function() {
            document.getElementById('output').textContent = "Button was clicked!";
        };
</script>

</body>
</html>
